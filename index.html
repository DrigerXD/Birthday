<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  overflow:hidden;
  background:linear-gradient(135deg,#ff4d6d,#ff758f,#ff8fab);
  color:white;
}

/* Floating hearts */
.hearts{
  position:fixed;
  width:100%;
  height:100%;
  overflow:hidden;
  z-index:0;
}

.heart{
  position:absolute;
  color:#fff;
  font-size:20px;
  animation:float 8s linear infinite;
  opacity:.7;
}

@keyframes float{
  0%{transform:translateY(100vh) scale(.5);}
  100%{transform:translateY(-120px) scale(1.4);}
}

.page{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

h1{
  font-size:3rem;
  text-shadow:0 0 20px rgba(255,255,255,.6);
}

h2{
  font-size:1.4rem;
  margin:15px 0;
  font-weight:300;
}

button{
  margin-top:30px;
  padding:15px 35px;
  border:none;
  border-radius:50px;
  background:white;
  color:#ff4d6d;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.08);
  box-shadow:0 0 20px white;
}

#surprise{
  display:none;
}

img{
  width:240px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 0 25px rgba(255,255,255,.5);
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<section class="page" id="home">
  <div style="font-size:55px;">❤️</div>
  <h1>Happy Birthday</h1>
  <h2>To The Love Of My Life</h2>
  <p style="max-width:300px;opacity:.9;">
    Every heartbeat of mine has your name in it.
  </p>

  <button onclick="startSurprise()">Open My Heart 🎁</button>
</section>

<section class="page" id="surprise">
  <img src="love.jpg" alt="Our Photo">

  <h1>I LOVE YOU ❤️</h1>
  <h2>Happy Birthday, My Princess</h2>
  <p>May your smile stay this beautiful forever.</p>
</section>

<script>
// Floating hearts
const hearts = document.getElementById("hearts");

for(let i=0;i<30;i++){
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = Math.random()>0.5 ? "❤" : "💖";
  h.style.left = Math.random()*100 + "%";
  h.style.animationDuration = (5+Math.random()*5)+"s";
  h.style.fontSize = (15+Math.random()*20)+"px";
  h.style.animationDelay = Math.random()*5+"s";
  hearts.appendChild(h);
}

// Button
function startSurprise(){
  document.getElementById("music").play();
  document.getElementById("home").style.display="none";
  document.getElementById("surprise").style.display="flex";
}
</script>

</body>
</html>
