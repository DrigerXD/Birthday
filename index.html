<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday ❤️</title>
  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#ff4d6d;
      color:white;
      text-align:center;
    }
    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }
    #surprise{
      display:none;
    }
    button{
      padding:15px 30px;
      font-size:18px;
      border:none;
      border-radius:30px;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <!-- Music -->
  <audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- First Screen -->
  <section class="page" id="home">
    <h1>Happy Birthday ❤️</h1>
    <button onclick="startSurprise()">Open Gift 🎁</button>
  </section>

  <!-- Surprise Screen -->
  <section class="page" id="surprise">
    <h1>I LOVE YOU ❤️</h1>
    <h2>Happy Birthday My Princess ✨</h2>
    <p>May all your dreams come true.</p>
  </section>

  <script>
    function startSurprise(){
      const music = document.getElementById("music");
      music.play();

      document.getElementById("home").style.display = "none";
      document.getElementById("surprise").style.display = "flex";
    }
  </script>

</body>
</html>
