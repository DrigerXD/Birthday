<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday ❤️</title>
  <style>
    body{
      margin:0;background:#ff4d6d;
      color:white;font-family:Arial;
      display:flex;justify-content:center;
      align-items:center;height:100vh;
      text-align:center;
    }
    h1{font-size:42px;}
    button{
      padding:12px 24px;border:none;
      border-radius:30px;font-size:18px;
    }
  </style>
</head>
  <div>
    <h1>Happy Birthday, My Love ❤️</h1>
    <p>You make every day beautiful.</p>
    
  </div>
<body>

<button onclick="openGift()">Open Gift 🎁</button>

<audio id="song" src="music.mp3"></audio>

<script>
async function openGift() {
  const song = document.getElementById("song");

  try {
    await song.play();          // Starts because it's from a button click
    setTimeout(() => {
      window.location.href = "surprise.html";
    }, 300);
  } catch (e) {
    alert("Tap again to play music.");
  }
}
</script>

</body>
</html>
